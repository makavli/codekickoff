name: test

# Kept small on purpose: one Linux job of about a minute per pull request, and on main the same job, then `release`.
# The token can only read, except in `release`, which publishes the merged version.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # a run on main publishes a release: let it finish

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Every merge into main is a release, so the version must be new
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::$tag is already released. Run: npm run bump <new version>, then write its CHANGELOG.md entry."
            exit 1
          fi
      - name: Pictures are up to date, and the tests pass
        run: npm run check

  # Every merge into main is a release: tag the merged commit and publish its changelog entry.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Publish this version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json holds an unexpected version: $version"
            exit 1
          fi
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already published: nothing to do."
            exit 0
          fi
          node tools/release-notes.mjs > "$RUNNER_TEMP/notes.md"
          gh release create "v$version" --target "$GITHUB_SHA" --title "CodeKickoff $version" --notes-file "$RUNNER_TEMP/notes.md" --latest
